services:
  postgres:
    image: postgres:16-alpine
    container_name: valimenta-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: valimenta
      POSTGRES_PASSWORD: valimenta_dev_pass
      POSTGRES_DB: valimenta_db
    volumes:
      - valimenta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U valimenta -d valimenta_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  valimenta_pgdata:
